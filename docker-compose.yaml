# Paper trading by default. See PLAN.md §7.
# Gateway image: gnzsnz/ib-gateway-docker (MIT), pinned; don't auto-update it.
services:

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: paper
      # Phase 1 only reads data. Phase 3 (guarded executor) switches this to "no".
      READ_ONLY_API: "yes"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: America/New_York
      TZ: America/New_York
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      # Host access for the CLI / survey run outside Docker (paper only).
      - "127.0.0.1:4002:4004"
      # VNC to watch the Gateway login; only active if VNC_SERVER_PASSWORD is set.
      - "127.0.0.1:5900:5900"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - ib-gateway
    environment:
      VERBOSE: ${VERBOSE:-false}
      IB_GATEWAY_HOST: ib-gateway
      IB_GATEWAY_PORT: 4004
      IB_CLIENT_ID: 11
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QUOTES_API_KEY: ${QUOTES_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Phase 1: log real prices during US market hours.
    command: ["python", "main.py", "--price-survey"]
