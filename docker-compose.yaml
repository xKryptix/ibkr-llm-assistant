# Paper trading by default. See PLAN.md §7.
# Gateway image: gnzsnz/ib-gateway-docker (MIT), pinned; don't auto-update it.
services:

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: paper
      # The bot needs order access (also for IBKR's order preview in dry run).
      # Every order still has to pass the bot's risk guard.
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: America/New_York
      TZ: America/New_York
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      # Host access for the CLI / survey run outside Docker (paper only).
      - "127.0.0.1:4002:4004"
      # VNC to watch the Gateway login; only active if VNC_SERVER_PASSWORD is set.
      - "127.0.0.1:5900:5900"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - ib-gateway
    environment:
      VERBOSE: ${VERBOSE:-false}
      IB_GATEWAY_HOST: ib-gateway
      IB_GATEWAY_PORT: 4004
      IB_CLIENT_ID: 11
      # Dry run until you set DRY_RUN=false in .env.
      DRY_RUN: ${DRY_RUN:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QUOTES_API_KEY: ${QUOTES_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "main.py", "--trade"]

  # Optional: log real option prices every 30 minutes (PLAN.md §4).
  # Start with: docker compose --profile survey up -d
  survey:
    build: .
    profiles: ["survey"]
    restart: unless-stopped
    depends_on:
      - ib-gateway
    environment:
      IB_GATEWAY_HOST: ib-gateway
      IB_GATEWAY_PORT: 4004
      IB_CLIENT_ID: 12
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "main.py", "--price-survey"]
